services:
  metabase:
    image: metabase/metabase:v0.58.1
    container_name: metabase
    hostname: metabase
    volumes:
      - ./metabase_app_data:/metabase/data:ro
    ports:
      - 127.0.0.1:3101:3000
    environment:
      MB_DB_TYPE: postgres
      MB_DB_DBNAME: metabasedb
      MB_DB_PORT: 5432
      MB_DB_USER: postgres
      MB_DB_PASS: postgres
      MB_DB_HOST: postgres18
    networks:
      - my
    healthcheck:
      test: curl --fail -I http://localhost:3101/api/health || exit 1
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  my:
    external: true
