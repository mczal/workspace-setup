# version: "3.9"
services:
  mongo:
    image: mongo:8.0
    container_name: mongo
    restart: unless-stopped
    environment:
      GLIBC_TUNABLES: "glibc.pthread.rseq=1"
    ports:
      - "127.0.0.1:27017:27017"
    volumes:
      - mongo-data:/data/db
    networks:
      - my

volumes:
  mongo-data:
    driver: local

networks:
  my:
    external: true
